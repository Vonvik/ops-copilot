services:
  # --- API (FastAPI) ---
  - type: web
    name: opscopilot-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: opscopilot_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # DB interna (privada) desde Render Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: opscopilot-db
          property: connectionString

      # Redis/KeyValue interno (privado)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: opscopilot-kv
          property: connectionString

      # URLs públicas: las pondremos después (cuando Render asigne dominios)
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: ENV
        value: production

  # --- Frontend (Next.js) ---
  - type: web
    name: opscopilot-frontend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: opscopilot_frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # NextAuth: secreto generado por Render
      - key: NEXTAUTH_SECRET
        generateValue: true

      # URL pública: la pondremos después
      - key: NEXTAUTH_URL
        sync: false

      # Base URL pública de la API: la pondremos después
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

      - key: NODE_ENV
        value: production

  # --- Redis compatible (Render Key Value) ---
  - type: keyvalue
    name: opscopilot-kv
    plan: free
    region: frankfurt
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: opscopilot-db
    plan: free
    region: frankfurt
    databaseName: opscopilot
    user: opscopilot
