services:
  # --- API (FastAPI) ---
  - type: web
    name: opscopilot-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: opscopilot_backend
    buildCommand: >
      python -m pip install -r requirements.txt &&
      python -m pip install --no-cache-dir
      https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opscopilot-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: opscopilot-kv
          property: connectionString

      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: ENV
        value: production

  # --- Frontend (Next.js) ---
  - type: web
    name: opscopilot-frontend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: opscopilot_frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXTAUTH_SECRET
        generateValue: true

      - key: NEXTAUTH_URL
        sync: false

      # IMPORTANTE: este es el que vas a configurar en Render
      # Ej: https://opscopilot-api.onrender.com   (sin /api/v1 también vale, el code lo añade)
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

      # Opcional pero recomendado (para SSR server-to-server)
      - key: INTERNAL_API_URL
        sync: false

      - key: NODE_ENV
        value: production

  # --- Redis compatible (Render Key Value) ---
  - type: keyvalue
    name: opscopilot-kv
    plan: free
    region: frankfurt
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: opscopilot-db
    plan: free
    region: frankfurt
    databaseName: opscopilot
    user: opscopilot
