name: opscopilot

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ops_copilot_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ops_copilot_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./opscopilot_backend
      dockerfile: Dockerfile
    image: opscopilot-backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      ENV: ${ENV:-development}
      AUTO_CREATE_TABLES: "false"

      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ops_copilot_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-ops_copilot_dev}

      SECRET_KEY: ${SECRET_KEY:-changeme}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      SECURE_COOKIES: "false"

      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      CORS_ALLOW_CREDENTIALS: "true"

      RATE_LIMIT_MAX_ATTEMPTS: "5"
      RATE_LIMIT_WINDOW_SECONDS: "300"
      RATE_LIMIT_BLOCK_SECONDS: "900"

      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_debug/ping').read()\""]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./opscopilot_frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    image: opscopilot-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000/api/v1}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-super-secret-change-me}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
